# Reverse-Proxy fuer urlaub-tracker OHNE eigene Domain - reiner IP:Port-
# Zugriff. Kein TLS moeglich ohne Domain (Let's Encrypt braucht einen
# Hostnamen). Basic-Auth wurde auf Nutzerwunsch (12.09.26, "empfinde ich
# als ueberaus nervig") wieder entfernt - Dashboard ist damit fuer jeden
# erreichbar, der die Server-IP + Port kennt. Fuer TLS/Auth spaeter: eine
# Subdomain anlegen und auf Caddy/certbot umstellen (siehe deploy/README.md).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
